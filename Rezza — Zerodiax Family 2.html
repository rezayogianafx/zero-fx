:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-behavior:smooth;scroll-padding-top:90px;background:#000}
body{margin:0;background:#000;color:#e6ecff;font-family:'Space Grotesk',system-ui,sans-serif;overflow-x:hidden}
.glass{background:rgba(8,12,28,.62);border:1px solid rgba(44,103,237,.28);backdrop-filter:blur(12px);border-radius:1.25rem}

.cur{animation:bl 1s steps(1) infinite}@keyframes bl{50%{opacity:0}}
.spin{animation:sp 9s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.flt{animation:fl 7s ease-in-out infinite}@keyframes fl{50%{transform:translateY(-22px)}}
.planet{background:radial-gradient(circle at 30% 30%,#7aa2ff,#2c67ed 45%,#0a1a4a 80%);box-shadow:0 0 90px rgba(44,103,237,.5)}
.grad{background:linear-gradient(90deg,#fff,#8fb0ff 50%,#2c67ed);-webkit-background-clip:text;background-clip:text;color:transparent}
input,textarea{background:rgba(255,255,255,.04);border:1px solid rgba(44,103,237,.3);border-radius:.8rem;padding:.8rem 1rem;color:#fff;width:100%;outline:none;font:inherit}
input:focus,textarea:focus{border-color:#2c67ed;box-shadow:0 0 14px rgba(44,103,237,.5)}

function Space(){
 const r=useRef();
 useEffect(()=>{
  const c=r.current,x=c.getContext('2d');let w,h,S=[],sh=[],id;
  const rs=()=>{w=c.width=innerWidth;h=c.height=innerHeight;S=Array.from({length:Math.min(230,Math.floor(w/5))},()=>({x:Math.random()*w,y:Math.random()*h,z:Math.random()*1.5+.3,p:Math.random()*6}))};
  rs();addEventListener('resize',rs);
  const f=t=>{x.clearRect(0,0,w,h);
   S.forEach(s=>{s.y+=s.z*.08;if(s.y>h)s.y=0;x.globalAlpha=.35+.65*Math.abs(Math.sin(t/900+s.p));x.fillStyle=s.z>1.2?'#8fb0ff':'#fff';x.beginPath();x.arc(s.x,s.y,s.z*.8,0,7);x.fill()});
   if(Math.random()<.012)sh.push({x:Math.random()*w,y:Math.random()*h*.5,l:0});
   sh=sh.filter(m=>{m.x-=9;m.y+=5;m.l++;x.globalAlpha=1-m.l/45;x.strokeStyle='#7aa2ff';x.lineWidth=1.5;x.beginPath();x.moveTo(m.x,m.y);x.lineTo(m.x+70,m.y-39);x.stroke();return m.l<45});
   id=requestAnimationFrame(f)};
  id=requestAnimationFrame(f);
  return()=>{cancelAnimationFrame(id);removeEventListener('resize',rs)}
 },[]);
 return html`<div className="fixed inset-0" style=${{zIndex:0,pointerEvents:'none'}}>
  <${motion.div} animate=${{x:[0,60,0],y:[0,40,0]}} transition=${{duration:18,repeat:Infinity}} className="absolute rounded-full" style=${{width:520,height:520,left:'-10%',top:'10%',background:'radial-gradient(circle,rgba(44,103,237,.22),transparent 70%)',filter:'blur(30px)'}}/>

  <canvas ref=${r}/></div>`}

function Typer({words}){

 useEffect(()=>{
  const w=words[i];let to;
  if(!d&&t===w)to=setTimeout(()=>sd(true),1500);
  else if(d&&t==='')to=setTimeout(()=>{sd(false);si((i+1)%words.length)},300);
  else to=setTimeout(()=>st(d?w.slice(0,t.length-1):w.slice(0,t.length+1)),d?45:95);
  return()=>clearTimeout(to)},[t,d,i]);
 return html`<span>${t}<span className="cur text-ac">|</span></span>`}
